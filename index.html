    <title>Circular Color Switcher</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            transition: background-color 0.5s ease; /* Smooth change */
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
        }
        button {
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            margin-top: 10px;
        }
        button:hover {
            background-color: #555;
        }
        #info {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Color Switcher</h1>
        <p>Modulo Logic: (Index + 1) % Length</p>
        <button onclick="changeColor()">Next Color</button>
        <div id="info">Current Index: 0</div>
    </div>

    <script>
        const colors = ["#FFADAD", "#9BF6FF", "#CAFFBF", "#FFD6A5", "#BDB2FF"];
        let currentIndex = 0;

        // Shuruat mein pehla color set karna
        document.body.style.backgroundColor = colors[0];

        function changeColor() {
            // Modulo Logic
            currentIndex = (currentIndex + 1) % colors.length;

            // UI Update karna
            document.body.style.backgroundColor = colors[currentIndex];
            document.getElementById("info").innerText = "Current Index: " + currentIndex;
            
            console.log("Color Changed to Index:", currentIndex);
        }
    </script>

</body>
</html> -->
